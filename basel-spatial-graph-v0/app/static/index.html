<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basel Spatial Graph</title>
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#0d0f12;color:#e8e9ea}header{height:54px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #262b31}header b{font-size:17px}header span{margin-left:auto;color:#8d98a5}main{height:calc(100vh - 54px);display:grid;grid-template-columns:1fr 360px}#map{height:100%}.panel{overflow:auto;border-left:1px solid #262b31;padding:16px}.card{background:#15191e;border:1px solid #292f36;border-radius:10px;padding:12px;margin-bottom:12px}.muted{color:#8d98a5}.chips button,.query{background:#20262d;color:#e8e9ea;border:1px solid #343c46;border-radius:7px;padding:7px 9px;margin:3px;cursor:pointer}.query{display:block;width:100%;text-align:left;margin:6px 0}pre{white-space:pre-wrap;font-size:12px;color:#c8d0d9}.edge{padding:7px 0;border-bottom:1px solid #252b31}.edge:last-child{border:0}@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:55vh 45vh}.panel{border-left:0;border-top:1px solid #262b31}}</style></head><body>
<header><b>Basel Spatial Graph</b><span id="status">loading…</span></header><main><div id="map"></div><aside class="panel">
<div class="card"><b>Layers</b><div class="chips"><button onclick="toggle('areas')">Areas</button><button onclick="toggle('schools')">Schools</button><button onclick="toggle('accidents')">Accidents</button></div></div>
<div class="card"><b>Graph questions</b><button class="query" onclick="analysis('/analysis/areas-by-accidents')">Rank areas by accidents</button><button class="query" onclick="analysis('/analysis/schools-by-nearby-accidents')">Rank schools by nearby accidents</button></div>
<div id="inspect" class="card"><b>Select an entity</b><p class="muted">Click a school, accident, or area. The panel will show the graph neighborhood, including derived relations and provenance.</p></div>
<div id="results" class="card" style="display:none"></div></aside></main>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script src="/static/app.js"></script></body></html>
