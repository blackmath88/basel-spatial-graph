<title id="title">Basel Spatial Graph: sources, graph, computation, interfaces</title><desc id="desc">OpenStreetMap, Basel open data, population statistics and Swiss GTFS form a prepared graph. Queries combine stored facts and relations with request-time routing. Four interfaces expose the same core: map, API, CLI and local MCP.</desc>
